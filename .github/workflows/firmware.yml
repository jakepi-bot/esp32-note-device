name: Firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build waveshare-epaper-154
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/esp32/platformio.ini', 'firmware/esp32/main/idf_component.yml') }}
      - name: Install PlatformIO
        run: pip install platformio==6.2.0
      - name: Build
        working-directory: firmware/esp32
        run: pio run -e waveshare-epaper-154
      # The same image bundle a release ships, so a CI build can be flashed directly.
      - name: Package
        working-directory: firmware/esp32
        run: python tools/package_release.py --board waveshare-epaper-154 --out dist
      - name: Keep the images
        uses: actions/upload-artifact@v7
        with:
          name: firmware-waveshare-epaper-154
          path: firmware/esp32/dist/
          if-no-files-found: error

  core:
    name: Host core tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S firmware -B build/host -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/host --config Release --parallel
      - name: Test
        run: ctest --test-dir build/host -C Release --output-on-failure
      # The phone half of the Bluetooth note sync, against a packet stream the
      # firmware itself printed (web/ble-note-relay/test/transfer-fixture.txt).
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Relay protocol tests
        run: node --test web/ble-note-relay/selftest.mjs
